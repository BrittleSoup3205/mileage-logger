name: Refine multi-device sync

on:
  push:
    branches:
      - agent/multi-device-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-device-sync

      - name: Apply sync refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sync = Path('sync-engine.js')
          text = sync.read_text(encoding='utf-8')

          marker = '  const SYNC_INTERVAL_MS = 20000;\n'
          addition = '''  const SYNC_INTERVAL_MS = 20000;\n  const DEFAULT_PROJECT_URL = "https://osvubxisjfplnljabvrn.supabase.co";\n  const DEFAULT_PUBLISHABLE_KEY = "sb_publishable_n3tp6B8y5abgPN1r7ITUYA_cMuE7AlP";\n'''
          if 'DEFAULT_PROJECT_URL' not in text:
              if marker not in text:
                  raise SystemExit('sync interval marker not found')
              text = text.replace(marker, addition, 1)

          old = '''      enabled: Boolean(config.enabled),\n      projectUrl: String(config.projectUrl || "").trim().replace(/\\/$/, ""),\n      publishableKey: String(config.publishableKey || "").trim(),'''
          new = '''      enabled: config.enabled === undefined ? true : Boolean(config.enabled),\n      projectUrl: String(config.projectUrl || DEFAULT_PROJECT_URL).trim().replace(/\\/$/, ""),\n      publishableKey: String(config.publishableKey || DEFAULT_PUBLISHABLE_KEY).trim(),'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('loadConfig defaults pattern not found')

          old = '''      const remoteRows = await fetchRemoteRecords();\n      const remoteByKey = new Map(remoteRows.map((row) => [recordKey(row.record_type, row.record_id), row]));\n      let remoteApplied = false;'''
          new = '''      const remoteRows = await fetchRemoteRecords();\n      const remoteByKey = new Map(remoteRows.map((row) => [recordKey(row.record_type, row.record_id), row]));\n      const initialCloudBootstrap = !meta.lastSyncISO && remoteRows.length > 0;\n      let remoteApplied = false;'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('initial bootstrap marker not found')

          old = '''        const localHash = localRecord ? hashValue(localRecord.payload) : (localMeta?.tombstone ? "__deleted__" : "__missing__");\n\n        if (!localMeta) {'''
          new = '''        const localHash = localRecord ? hashValue(localRecord.payload) : (localMeta?.tombstone ? "__deleted__" : "__missing__");\n        const contentDiffers = localHash !== remoteHash;\n\n        if (!localMeta || (initialCloudBootstrap && contentDiffers)) {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('bootstrap comparison pattern not found')

          duplicate = '''        const contentDiffers = localHash !== remoteHash;\n\n        if (localDirty && remoteChanged && contentDiffers) {'''
          replacement = '''        if (localDirty && remoteChanged && contentDiffers) {'''
          if duplicate in text:
              text = text.replace(duplicate, replacement, 1)

          sync.write_text(text, encoding='utf-8')

          test = Path('tests/multi-device-sync.test.cjs')
          text = test.read_text(encoding='utf-8')
          additions = '''\nassert.match(sync, /DEFAULT_PROJECT_URL/, "Cloud project should be preconfigured so users do not paste infrastructure settings");\nassert.match(sync, /DEFAULT_PUBLISHABLE_KEY/, "Only the public publishable key may be preconfigured in the client");\nassert.match(sync, /initialCloudBootstrap/, "A newly linked second device must prefer existing cloud state on its first synchronization");\n'''
          if 'initialCloudBootstrap' not in text:
              text = text.replace('\nconsole.log("Multi-device sync regression checks passed.");', additions + '\nconsole.log("Multi-device sync regression checks passed.");')
          test.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check app.js
          node --check inspections.js
          node --check workflow-data.js
          node --check workflow-queues.js
          node --check sync-engine.js
          node --check service-worker.js
          node tests/active-trip-inspection.test.cjs
          node tests/workflow-data.test.cjs
          node tests/backup-compatibility.test.cjs
          node tests/multi-device-sync.test.cjs

      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync-engine.js tests/multi-device-sync.test.cjs
          if git diff --cached --quiet; then
            echo "No refinements needed"
            exit 0
          fi
          git commit -m "Harden first multi-device synchronization"
          git push origin HEAD:agent/multi-device-sync

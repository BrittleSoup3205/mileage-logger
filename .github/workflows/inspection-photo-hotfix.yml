name: Apply inspection photo export fix

on:
  push:
    branches:
      - agent/fix-inspection-trip-photos
    paths:
      - .github/workflows/inspection-photo-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.head_commit.message == 'Bootstrap inspection photo export fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/fix-inspection-trip-photos
          fetch-depth: 0

      - name: Patch inspection Word photo export
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def require_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path("inspections.js")
          source = path.read_text()

          marker = '  function photoFigureCaption(photo, figureNumber) {'
          if source.count(marker) != 1:
              raise SystemExit("photoFigureCaption marker not unique")
          report_refs = r'''  function inspectionReportPhotoReferences(state, inspection) {
    const seenIds = new Set();
    const references = [];
    const addReference = (photo, sourceTripId = "") => {
      if (!photo) return;
      const copy = { ...photo };
      if (sourceTripId && !copy.sourceTripId) copy.sourceTripId = sourceTripId;
      const id = String(copy.id || "").trim();
      const fallbackKey = [copy.name, copy.createdISO, copy.caption]
        .map((value) => String(value || "").trim())
        .join("|");
      const key = id || fallbackKey;
      if (key && seenIds.has(key)) return;
      if (key) seenIds.add(key);
      references.push(copy);
    };

    // Inspection-owned photos take precedence so their report layout, rotation,
    // and captions remain authoritative if an older build also copied a trip photo.
    inspectionSpecificPhotoReferences(inspection).forEach((photo) => addReference(photo));

    const sourceState = state || readState();
    const trip = getTripById(sourceState, inspection?.tripId);
    (Array.isArray(trip?.photos) ? trip.photos : []).forEach((photo) => addReference(photo, trip.id));

    // Preserve compatibility with older records that stored inherited trip-photo
    // references on the inspection itself. They remain trip-owned and are deduped.
    (Array.isArray(inspection?.photos) ? inspection.photos : [])
      .filter((photo) => photo?.sourceTripId)
      .forEach((photo) => addReference(photo, photo.sourceTripId));

    return references;
  }

'''
          source = source.replace(marker, report_refs + marker, 1)

          source = require_replace(
              source,
              '    const photos = inspectionSpecificPhotoReferences(inspection);',
              '    const photos = inspectionReportPhotoReferences(state, inspection);',
              "preview photo source"
          )
          source = require_replace(
              source,
              '<section class="inspection-preview-section"><h3>Inspection photos (${model.photos.length})</h3>${model.photos.length ? `<div class="inspection-preview-photos">',
              '<section class="inspection-preview-section"><h3>Report photos — visit + inspection (${model.photos.length})</h3>${model.photos.length ? `<div class="inspection-preview-photos">',
              "preview photo heading"
          )
          source = require_replace(
              source,
              ': `<p class="muted">No inspection-specific photos are attached.</p>`}</section>',
              ': `<p class="muted">No trip-level or inspection-specific photos are available for this report.</p>`}</section>',
              "preview empty photo text"
          )

          start = source.index('  async function loadPackagePhotos(inspection) {')
          end = source.index('\n\n  async function deliverInspectionPackage', start)
          new_loader = r'''  async function loadPackagePhotos(inspection) {
    if (!window.MileageMediaStore) return [];
    const state = readState();
    const references = inspectionReportPhotoReferences(state, inspection);
    const stored = await window.MileageMediaStore.getAllPhotos();
    // Match by unique photo ID so both trip-owned visit photos and inspection-owned
    // photos can be embedded without copying image blobs between records.
    const byId = new Map(stored.map((photo) => [photo.id, photo]));
    const missing = [];
    const loaded = references.map((metadata, index) => {
      const photoId = String(metadata?.id || "").trim();
      const photo = photoId ? byId.get(photoId) : null;
      if (!photo?.blob) {
        missing.push(metadata?.caption || metadata?.name || photoId || `Photo ${index + 1}`);
        return null;
      }
      const extension = photoExtension(photo);
      const sequence = String(index + 1).padStart(2, "0");
      const friendlyName = safeFilePart(metadata.caption || photo.caption || metadata.name || photo.name, `Inspection_Photo_${sequence}`);
      return {
        ...photo,
        ...metadata,
        blob: photo.blob,
        packagePath: `Photos/${sequence}_${friendlyName}.${extension}`
      };
    }).filter(Boolean);

    if (missing.length) {
      const preview = missing.slice(0, 3).join("; ");
      const more = missing.length > 3 ? `; +${missing.length - 3} more` : "";
      throw new Error(`${missing.length} of ${references.length} report photo${missing.length === 1 ? "" : "s"} could not be loaded on this device (${preview}${more}). The Word report was not exported so it cannot be mistaken for a complete report.`);
    }
    return loaded;
  }'''
          source = source[:start] + new_loader + source[end:]

          source = require_replace(
              source,
              '    inspectionSpecificPhotoReferences,\n    photoFigureCaption,',
              '    inspectionSpecificPhotoReferences,\n    inspectionReportPhotoReferences,\n    photoFigureCaption,',
              "test API export"
          )
          path.write_text(source)

          sw = Path("service-worker.js")
          sw_text = sw.read_text()
          sw_text = require_replace(sw_text, 'mileage-logger-full-upgrade-list-v68', 'mileage-logger-full-upgrade-list-v69', 'cache version')
          sw_text = require_replace(sw_text, './inspections.js?v=full-upgrade-list-1', './inspections.js?v=inspection-trip-photos-1', 'service worker inspection asset')
          sw.write_text(sw_text)

          index = Path("index.html")
          index_text = index.read_text()
          index_text = require_replace(index_text, './inspections.js?v=full-upgrade-list-1', './inspections.js?v=inspection-trip-photos-1', 'index inspection asset')
          index.write_text(index_text)

          test = Path("tests/inspection-trip-photo-export.test.cjs")
          test.write_text(r'''const assert = require("node:assert/strict");
const fs = require("node:fs");
const path = require("node:path");
const vm = require("node:vm");

const root = path.join(__dirname, "..");
const source = fs.readFileSync(path.join(root, "inspections.js"), "utf8");
const localStorage = { getItem: () => null, setItem: () => {} };
const document = { readyState: "loading", addEventListener: () => {}, getElementById: () => null };
const window = {
  localStorage,
  MileageWorkflowData: { inspectionLoads: (inspection) => inspection.loads || [] },
  MileageActiveJobsData: { activeJobs: [] },
  MileageActiveJobsManagement: { getActiveJobs: (state) => state.settings.activeJobs || [] }
};
const context = vm.createContext({
  window, document, console, Blob, Uint8Array, URL, Date, Math, Map, Set, Object, Array, String, Number, Boolean
});
vm.runInContext(source, context, { filename: "inspections.js" });
const api = window.MileageInspectionReportTesting;
assert.ok(api?.inspectionReportPhotoReferences, "Report photo selector must be exposed for regression testing");

const inspectionPhoto = { id: "inspection-photo", name: "inspection.jpg", caption: "Inspection-owned evidence", type: "image/jpeg", reportLayout: "fit" };
const tripPhoto = { id: "trip-photo", name: "trip.jpg", caption: "Visit evidence", type: "image/jpeg" };
const state = {
  trips: [{ id: "trip-1", photos: [tripPhoto] }],
  settings: { activeJobs: [], inspections: [] }
};
const inspection = {
  id: "inspection-1",
  tripId: "trip-1",
  photos: [inspectionPhoto, { ...tripPhoto, sourceTripId: "trip-1", caption: "Legacy copied visit evidence" }]
};
const refs = api.inspectionReportPhotoReferences(state, inspection);
assert.deepEqual(Array.from(refs, (photo) => photo.id), ["inspection-photo", "trip-photo"], "Word report must include inspection and linked-trip photos exactly once");
assert.equal(refs[0].reportLayout, "fit", "Inspection-owned report formatting must be preserved");
assert.equal(refs[1].sourceTripId, "trip-1", "Trip ownership must remain identifiable without copying the image into the inspection record");
assert.match(source, /async function loadPackagePhotos\(inspection\)[^]*inspectionReportPhotoReferences\(state, inspection\)/, "Word package loader must use the combined report-photo selector");
assert.match(source, /The Word report was not exported so it cannot be mistaken for a complete report\./, "Missing photo blobs must block a misleading incomplete export");
console.log("inspection trip-photo export regression checks passed");
''')
          PY

      - name: Run JavaScript syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check inspections.js
          node tests/inspection-word-preview.test.cjs
          node tests/inspection-trip-photo-export.test.cjs
          for test_file in tests/*.test.cjs; do
            node "$test_file" >/dev/null
          done

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspections.js service-worker.js index.html tests/inspection-trip-photo-export.test.cjs
          git commit -m "Fix trip photos in inspection Word exports"
          git push origin HEAD:agent/fix-inspection-trip-photos

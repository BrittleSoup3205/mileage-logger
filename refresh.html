<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <title>Mileage Logger Refresh</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#f4f7fb;padding:24px;box-sizing:border-box}
    main{width:min(560px,100%);padding:24px;border:1px solid #2d3a50;border-radius:18px;background:#111a2b}
    h1{margin:0 0 10px;font-size:1.45rem} p{line-height:1.45;color:#c4ccda} .status{margin-top:18px;padding:12px;border-radius:10px;background:#1c2a40;font-weight:700}
    button{margin-top:16px;width:100%;min-height:46px;border:0;border-radius:10px;background:#8ec5ff;color:#0d1728;font:inherit;font-weight:800}
  </style>
</head>
<body>
  <main>
    <h1>Mileage Logger Update Refresh</h1>
    <p>This refreshes only the app shell and cached program files. It does <strong>not</strong> delete mileage records, inspections, settings, photos, or the private STA master stored on this device.</p>
    <div id="status" class="status">Preparing refresh…</div>
    <button id="retry" type="button" hidden>Retry Refresh</button>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');
      async function refreshApp() {
        retry.hidden = true;
        status.textContent = 'Removing old app caches and service worker…';
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          status.textContent = 'Refresh complete. Loading the current Mileage Logger…';
          setTimeout(() => location.replace('./?app-refresh=20260911-1652'), 350);
        } catch (error) {
          console.error('Mileage Logger cache refresh failed:', error);
          status.textContent = 'Automatic refresh did not complete. Tap Retry Refresh.';
          retry.hidden = false;
        }
      }
      retry.addEventListener('click', refreshApp);
      refreshApp();
    })();
  </script>
</body>
</html>
